<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveMark</title>
  <link rel="stylesheet" href="renderer/styles.css">
</head>
<body>
  <button id="rail-toggle" type="button" class="rail-toggle" aria-expanded="false" aria-controls="rail" data-string-aria-label="rail.show" data-string-title="rail.show">
    <span id="rail-toggle-label" data-string="rail.documents"></span>
    <svg class="rail-toggle__mark" width="12" height="12" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5L10.5 7.5 6 11.5"></path></svg>
  </button>
  <aside id="rail" class="rail" data-string-aria-label="rail.label">
    <div class="rail__titlebar" data-tauri-drag-region>
      <button id="rail-hide-btn" type="button" class="icon-button panel-hide" data-string-title="rail.hide" data-string-aria-label="rail.hide">
        <svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5"></rect><path d="M5.5 2.5v10"></path></svg>
      </button>
    </div>
    <button id="go-to-file-btn" type="button" class="rail__search">
      <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"></circle><path d="M10 10l3.5 3.5"></path></svg>
      <span data-string="rail.goToFile"></span>
      <kbd class="kbd" data-string="shortcut.goToFile"></kbd>
    </button>
    <section id="documents-section" class="panel-section" data-section="documents">
      <div class="panel-section__header">
        <button type="button" class="panel-section__toggle" aria-expanded="true" aria-controls="document-tabs">
          <svg class="panel-section__chevron" width="10" height="10" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5L10.5 7.5 6 11.5"></path></svg>
          <span id="rail-heading" class="panel-section__title"></span>
        </button>
        <span id="rail-count" class="panel-section__meta"></span>
      </div>
      <div id="document-tabs" class="document-tabs panel-section__body" role="tablist" aria-orientation="vertical" aria-labelledby="rail-heading"></div>
    </section>
    <div id="rail-slots" class="panel-slots" data-panel="rail" data-string-data-drop-label="section.dropHere"></div>

    <footer class="rail__footer">
      <div id="app-update-banner" class="app-update" role="status" hidden>
        <div class="app-update__head">
          <span class="app-update__dot" aria-hidden="true"></span>
          <div class="app-update__text">
            <span id="app-update-text" class="app-update__title"></span>
            <span id="app-update-detail" class="app-update__detail"></span>
          </div>
          <button id="app-update-dismiss" type="button" class="icon-button" data-string-aria-label="update.dismiss">
            <svg width="11" height="11" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 4l7 7M11 4l-7 7"></path></svg>
          </button>
        </div>
        <div class="app-update__actions">
          <button id="app-update-action" type="button" class="link-button app-update__primary" hidden></button>
          <button id="app-update-notes" type="button" class="link-button" data-string="update.releaseNotes" hidden></button>
        </div>
      </div>
      <div class="rail__footer-row">
        <span id="watching-count"></span>
        <span class="rail__hint" data-string="rail.closeHint"></span>
      </div>
      <label class="theme-toggle" data-string-title="rail.themeTitle">
        <span class="theme-toggle-label"><span data-string="rail.theme"></span> <span id="app-version" class="app-version" data-string-aria-label="rail.versionLabel"></span></span>
        <span class="switch">
          <input type="checkbox" id="theme-toggle-input">
          <span class="switch__track"></span>
        </span>
      </label>
    </footer>
    <div id="rail-resize" class="rail__resize" role="separator" aria-orientation="vertical" tabindex="0" data-string-aria-label="rail.resize" data-string-title="rail.resize"></div>
  </aside>

  <div id="workspace" class="workspace">
    <div class="workspace__titlebar" data-tauri-drag-region><span id="workspace-crumb" class="workspace__crumb" hidden><span id="workspace-crumb-name" class="workspace__crumb-name"></span><span class="workspace__crumb-sep" aria-hidden="true">›</span><span id="workspace-crumb-section"></span></span></div>
    <div id="panes" class="panes"></div>

    <div id="empty-state" class="empty-state">
      <h1 data-string="empty.title"></h1>
      <p data-string="empty.lead"></p>
      <button id="open-file-btn" class="open-file-btn" data-string="empty.open"></button>
      <p class="hint" data-string="empty.hint"></p>
    </div>
  </div>

  <aside id="margin-column" class="margin-column" data-string-aria-label="margin.label">
    <div class="margin-column__titlebar" data-tauri-drag-region>
      <button id="details-hide-btn" type="button" class="icon-button panel-hide" data-string-title="details.hide" data-string-aria-label="details.hide">
        <svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5"></rect><path d="M9.5 2.5v10"></path></svg>
      </button>
    </div>
    <div id="details-slots" class="panel-slots" data-panel="details" data-string-data-drop-label="section.dropHere"></div>
    <section id="links-out" class="panel-section" data-section="links" hidden>
      <div class="panel-section__header">
        <button type="button" class="panel-section__toggle" aria-expanded="true" aria-controls="links-out-list">
          <svg class="panel-section__chevron" width="10" height="10" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5L10.5 7.5 6 11.5"></path></svg>
          <span id="links-out-heading" class="panel-section__title" data-string="margin.linksOut"></span>
        </button>
      </div>
      <div id="links-out-list" class="links-out-list panel-section__body"></div>
    </section>
    <dl class="file-facts">
      <dt data-string="facts.path"></dt><dd id="file-path" class="file-path"></dd>
      <dt data-string="facts.modified"></dt><dd id="last-updated"></dd>
      <dt data-string="facts.size"></dt><dd id="fact-size"></dd>
      <dt data-string="facts.opened"></dt><dd id="fact-opened"></dd>
    </dl>
  </aside>

  <aside id="details-strip" class="details-strip" hidden>
    <button id="details-show-btn" type="button" class="details-strip__button">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="details-strip-count" class="details-strip__count"></span>
      <span class="details-strip__label" data-string="section.changes"></span>
    </button>
  </aside>

  <section id="changes-section" class="panel-section panel-section--movable" data-section="changes" hidden>
    <div class="panel-section__header" draggable="true">
      <button type="button" class="panel-section__grip" data-string-title="section.dragHint"><svg width="10" height="12" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.1"></circle><circle cx="7" cy="3" r="1.1"></circle><circle cx="3" cy="7" r="1.1"></circle><circle cx="7" cy="7" r="1.1"></circle><circle cx="3" cy="11" r="1.1"></circle><circle cx="7" cy="11" r="1.1"></circle></svg></button>
      <button type="button" class="panel-section__toggle" aria-expanded="true" aria-controls="changes-body">
        <svg class="panel-section__chevron" width="10" height="10" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5L10.5 7.5 6 11.5"></path></svg>
        <span class="panel-section__title" data-string="section.changes"></span>
      </button>
      <span class="panel-section__summary"><span class="live-dot" aria-hidden="true"></span><span id="changes-summary"></span></span>
      <button id="pause-btn" type="button" class="panel-section__action"></button>
    </div>
    <div id="changes-body" class="panel-section__body changes-body">
      <div id="live-status" class="live-status" data-state="idle" aria-live="polite">
        <div class="live-status__row">
          <span class="live-status__dot" aria-hidden="true"></span>
          <span id="live-status-label" class="live-status__label"></span>
        </div>
        <div id="live-status-detail" class="live-status__detail"></div>
      </div>
      <div id="reload-log-list" class="reload-log-list"></div>
      <div class="live-status__actions">
        <button id="status-action-btn" type="button" class="link-button" hidden></button>
        <kbd id="status-action-kbd" class="kbd" hidden data-string="shortcut.nextChange"></kbd>
        <button id="all-reloads-btn" type="button" class="link-button live-status__all" aria-expanded="false" aria-controls="history-popover" data-string="status.allReloads"></button>
      </div>
    </div>
  </section>

  <nav id="outline" class="panel-section panel-section--movable" data-section="outline" aria-labelledby="outline-heading" hidden>
    <div class="panel-section__header" draggable="true">
      <button type="button" class="panel-section__grip" data-string-title="section.dragHint"><svg width="10" height="12" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.1"></circle><circle cx="7" cy="3" r="1.1"></circle><circle cx="3" cy="7" r="1.1"></circle><circle cx="7" cy="7" r="1.1"></circle><circle cx="3" cy="11" r="1.1"></circle><circle cx="7" cy="11" r="1.1"></circle></svg></button>
      <button type="button" class="panel-section__toggle" aria-expanded="true" aria-controls="outline-body">
        <svg class="panel-section__chevron" width="10" height="10" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5L10.5 7.5 6 11.5"></path></svg>
        <span id="outline-heading" class="panel-section__title" data-string="margin.outline"></span>
      </button>
      <span id="outline-summary" class="panel-section__summary"></span>
    </div>
    <div id="outline-body" class="panel-section__body">
      <div id="outline-list" class="outline-list"></div>
      <div id="outline-legend" class="outline-legend" hidden><span class="outline-item__dot" aria-hidden="true"></span><span data-string="margin.changedSection"></span></div>
    </div>
  </nav>

  <div id="rail-mini" class="rail-mini" hidden>
    <span id="rail-mini-version" class="rail-mini__version"></span>
    <button id="rail-mini-update" type="button" class="link-button rail-mini__update" hidden><span class="rail-mini__update-dot" aria-hidden="true"></span><span id="rail-mini-update-text"></span></button>
    <button id="rail-mini-theme" type="button" class="icon-button rail-mini__theme" data-string-title="rail.themeTitle" data-string-aria-label="rail.themeTitle" aria-pressed="false">
      <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12.5 9.2A5.5 5.5 0 0 1 5.8 2.5a5.5 5.5 0 1 0 6.7 6.7z"></path></svg>
    </button>
  </div>

  <div id="history-popover" class="popover" role="dialog" data-string-aria-label="history.label" hidden>
    <div class="popover__header">
      <span class="popover__title" data-string="history.title"></span>
      <span id="history-since" class="popover__subtitle"></span>
    </div>
    <div id="history-list" class="history-list"></div>
    <div class="popover__footer">
      <button id="clear-marks-btn" type="button" class="link-button" data-string="history.clearMarks"></button>
      <span class="popover__step"><span data-string="history.step"></span> <kbd class="kbd kbd--boxed" data-string="shortcut.nextChange"></kbd></span>
    </div>
    <div class="popover__settings">
      <span class="margin-section__heading" data-string="settings.title"></span>
      <label class="setting"><span data-string="settings.markBlocks"></span><span class="switch"><input type="checkbox" id="setting-mark-blocks"><span class="switch__track"></span></span></label>
      <label class="setting"><span data-string="settings.fadeMarks"></span><span class="switch"><input type="checkbox" id="setting-fade-marks"><span class="switch__track"></span></span></label>
      <label class="setting"><span data-string="settings.notify"></span><span class="switch"><input type="checkbox" id="setting-notify-all"><span class="switch__track"></span></span></label>
    </div>
  </div>

  <div id="palette" class="palette" role="dialog" data-string-aria-label="palette.label" hidden>
    <input id="palette-input" class="palette__input" type="text" data-string-placeholder="palette.placeholder" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list">
    <div id="palette-list" class="palette__list" role="listbox"></div>
  </div>

  <div id="find-bar" class="find-bar" role="search" data-string-aria-label="find.label" hidden>
    <input id="find-input" class="find-bar__input" type="text" data-string-placeholder="find.placeholder" autocomplete="off" spellcheck="false">
    <span id="find-count" class="find-bar__count" aria-live="polite"></span>
    <button id="find-close-btn" type="button" class="icon-button" data-string-title="find.close" data-string-aria-label="find.close">
      <svg width="11" height="11" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 4l7 7M11 4l-7 7"></path></svg>
    </button>
  </div>

  <div id="tab-menu" class="tab-menu" role="menu" data-string-aria-label="tab.menu" hidden>
    <button id="tab-menu-copy-path" type="button" class="tab-menu__item" role="menuitem" data-string="tab.copyPath"></button>
    <button id="tab-menu-open-folder" type="button" class="tab-menu__item" role="menuitem" data-string="tab.openFolder"></button>
  </div>

  <div id="about-dialog" class="about" role="dialog" aria-modal="true" data-string-aria-label="about.label" hidden>
    <div class="about__card">
      <div class="about__header">
        <span class="about__name" data-string="app.name"></span>
        <span id="about-version" class="about__version"></span>
      </div>
      <p class="about__description" data-string="about.description"></p>
      <button id="about-close-btn" type="button" class="link-button" data-string="about.close"></button>
    </div>
  </div>

  <div id="update-notification" class="toast" role="status">
    <span class="toast__dot" aria-hidden="true"></span>
    <div class="toast__text">
      <span id="toast-title" class="toast__title"></span>
      <span id="toast-detail" class="toast__detail"></span>
    </div>
    <button id="toast-view-btn" type="button" class="link-button" data-string="toast.view" hidden></button>
  </div>


  <script src="renderer/renderer.js"></script>
</body>
</html>
