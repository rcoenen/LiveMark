name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build macOS application
        run: npm run tauri build -- --bundles app

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Rename setup to release naming
        run: |
          Get-ChildItem 'src-tauri/target/release/bundle/nsis/*_x64-setup.exe' |
            Rename-Item -NewName { $_.Name -replace '^LiveMark_(.+)_x64-setup\.exe$', 'LiveMark-$1-win-x64-setup.exe' }

      # The real x64 setup, downloadable from this run. This is not a GitHub Release.
      - name: Upload x64 setup
        uses: actions/upload-artifact@v4
        with:
          name: LiveMark-x64-setup
          path: src-tauri/target/release/bundle/nsis/*win-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  build-windows-arm:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Windows ARM installer
        run: npm run tauri build -- --bundles nsis --target aarch64-pc-windows-msvc

      - name: Rename setup to release naming
        run: |
          Get-ChildItem 'src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*_arm64-setup.exe' |
            Rename-Item -NewName { $_.Name -replace '^LiveMark_(.+)_arm64-setup\.exe$', 'LiveMark-$1-win-arm64-setup.exe' }

      # The real arm64 setup, downloadable from this run. This is not a GitHub Release.
      - name: Upload arm64 setup
        uses: actions/upload-artifact@v4
        with:
          name: LiveMark-arm64-setup
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*win-arm64-setup.exe
          if-no-files-found: error
          retention-days: 14
