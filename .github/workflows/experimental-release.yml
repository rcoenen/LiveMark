name: Experimental release (macOS)

# Builds a Mac-only prerelease when a branch other than main carries an experimental version in
# package.json (such as 1.7.0-experimental.1) that has no release yet. The workflow tags the commit it
# built. The prerelease is never the latest release, so the in-app updater, the Homebrew cask and the
# download badges stay on stable.
on:
  push:
    branches-ignore:
      - main
      - download-badges
      - "release-please--**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Decide whether this commit is a new experimental release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-experimental*) ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT"; echo "${VERSION} is not experimental"; exit 0 ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test and build application
        run: |
          npm test
          npm run build

      - name: Package Apple silicon build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run dist

      - name: Verify application signature and DMG
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/LiveMark.app
          hdiutil verify dist/LiveMark-*-mac-arm64.dmg

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          DMG="dist/LiveMark-${VERSION}-mac-arm64.dmg"
          (cd dist && shasum -a 256 "$(basename "$DMG")" > SHA256SUMS-experimental.txt)
          cat > /tmp/notes.md <<NOTES
          Experimental build for macOS (Apple silicon). It adds review comments that are saved inside the Markdown file.

          - Select text in a document and press Comment (⌘⌥M). Comments appear in the Comments section of the right panel.
          - LiveMark writes only the comment block at the end of the file, and only when the file is unchanged since it was read.
          - The format is LiveMark's own; Google Docs does not read these comments.

          See docs/comments.md for details and limits. This build is not offered through the in-app updater or Homebrew.

          Install: open the DMG, drag LiveMark into Applications, then run \`xattr -cr /Applications/LiveMark.app\`. This replaces an installed stable copy; reinstall the stable DMG to go back.
          NOTES
          sed -i '' 's/^          //' /tmp/notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "LiveMark ${VERSION} (experimental, Mac)" --notes-file /tmp/notes.md
          fi
          gh release upload "$RELEASE_TAG" "$DMG" dist/SHA256SUMS-experimental.txt --clobber
