name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish, or to promote, such as v1.7.0
        required: true
        type: string
      promote:
        description: Mark this tag as the latest release and bump the Homebrew cask. Does not rebuild.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Hold the release off latest
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --prerelease

  build-macos:
    needs: release-please
    if: ${{ always() && github.event.inputs.promote != 'true' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Record release tag
        id: tag
        run: echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test and build application
        run: |
          npm test
          npm run build

      - name: Package Apple silicon release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run dist

      - name: Verify application signature
        run: |
          APP=src-tauri/target/release/bundle/macos/LiveMark.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q "Signature=adhoc"

      - name: Verify DMG
        run: hdiutil verify dist/LiveMark-*-arm64.dmg

      - name: Stage macOS artifacts
        run: |
          mkdir -p release
          if [ ! -f scripts/install.sh ]; then
            git fetch origin main --depth 1
            git checkout origin/main -- scripts/install.sh
          fi
          cp dist/LiveMark-* dist/latest.json scripts/install.sh release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: release/
          if-no-files-found: error

  build-windows:
    needs: release-please
    if: ${{ always() && github.event.inputs.promote != 'true' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test and build application
        run: |
          npm test
          npm run build

      - name: Package Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --bundles nsis
          node scripts/prepare-windows-release.mjs x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/LiveMark_*_x64-setup.exe
            dist/LiveMark_*_x64-setup.exe.sig
            dist/windows-x64-platform.json
          if-no-files-found: error

  build-windows-arm:
    needs: release-please
    if: ${{ always() && github.event.inputs.promote != 'true' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test and build application
        run: |
          npm test
          npm run build

      - name: Package Windows ARM installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --bundles nsis --target aarch64-pc-windows-msvc
          node scripts/prepare-windows-release.mjs arm64

      - name: Upload Windows ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-release
          path: |
            dist/LiveMark_*_arm64-setup.exe
            dist/LiveMark_*_arm64-setup.exe.sig
            dist/windows-arm64-platform.json
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows, build-windows-arm]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-windows-arm.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.build-macos.outputs.release_tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Merge the updater manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp parts/mac-release/LiveMark-* parts/mac-release/install.sh dist/
          cp parts/windows-release/LiveMark_*_x64-setup.exe parts/windows-release/LiveMark_*_x64-setup.exe.sig dist/
          cp parts/windows-arm-release/LiveMark_*_arm64-setup.exe parts/windows-arm-release/LiveMark_*_arm64-setup.exe.sig dist/
          node scripts/merge-latest.mjs \
            parts/mac-release/latest.json \
            dist/latest.json \
            parts/windows-release/windows-x64-platform.json \
            parts/windows-arm-release/windows-arm64-platform.json
          cd dist
          sha256sum \
            LiveMark-*-arm64.dmg \
            LiveMark-mac.dmg \
            LiveMark-*-arm64-mac.zip \
            LiveMark-*-arm64.app.tar.gz \
            LiveMark_*_x64-setup.exe \
            LiveMark_*_arm64-setup.exe \
            > SHA256SUMS.txt

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "LiveMark ${RELEASE_TAG#v}" --generate-notes
          fi

      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/LiveMark-* \
            dist/LiveMark_*.exe \
            dist/LiveMark_*.exe.sig \
            dist/latest.json \
            dist/SHA256SUMS.txt \
            dist/install.sh \
            --clobber

      - name: Update Homebrew cask on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            echo "Pre-release stays off latest. Promote it after the Windows smoke test."
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          SHA256="$(sha256sum "dist/LiveMark-${VERSION}-arm64.dmg" | awk '{print $1}')"
          if [ ! -f Casks/livemark.rb ]; then
            echo "No Homebrew cask on main; skipping"
            exit 0
          fi
          perl -i -pe "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/livemark.rb
          perl -i -pe "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/livemark.rb
          if git diff --quiet -- Casks/livemark.rb; then
            echo "Homebrew cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/livemark.rb
          git commit -m "chore(brew): bump livemark cask to ${VERSION}"
          git push origin main

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Promote the release and bump the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$names" | grep -q '_x64-setup\.exe$'
          printf '%s\n' "$names" | grep -q '_arm64-setup\.exe$'
          printf '%s\n' "$names" | grep -q -- '-arm64\.dmg$'
          gh release edit "$RELEASE_TAG" --prerelease=false --latest
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern 'LiveMark-*-arm64.dmg' --dir dist --clobber
          VERSION="${RELEASE_TAG#v}"
          SHA256="$(sha256sum "dist/LiveMark-${VERSION}-arm64.dmg" | awk '{print $1}')"
          if [ ! -f Casks/livemark.rb ]; then
            echo "No Homebrew cask on main; release is latest"
            exit 0
          fi
          perl -i -pe "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/livemark.rb
          perl -i -pe "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/livemark.rb
          if git diff --quiet -- Casks/livemark.rb; then
            echo "Homebrew cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/livemark.rb
          git commit -m "chore(brew): bump livemark cask to ${VERSION}"
          git push origin main
